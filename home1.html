<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Clock</title>
    <style>
        html, body 
        {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body 
        {
            background: url('./Swans.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }

        #clock 
        {
            color: white;
            font-size: 5em;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            font-family: Courier-new;

        }
    </style>
</head>

<body>
    <div id="clock"></div>

    <a href="https://chat.openai.com/" target="_blank"
       style="position: absolute; top: 20px; right: 20px;
              background: rgba(0,0,0,0.5); color: white;
              padding: 10px 15px; border-radius: 8px;
              text-decoration: none; font-family: sans-serif;
              font-size: 12px">
        ChatGPT
    </a>

    <script>
        function updateClock() 
        {
            const now = new Date();
            const time = now.toLocaleTimeString();
            document.getElementById('clock').textContent = time;
        }

        updateClock(); // Initial call
        setInterval(updateClock, 1000); // Update every second
    </script>
</body>

<form action="https://www.ecosia.org/search" method="get"
      style="position: relative; text-align: center;">
    
    <input type="text" name="q" placeholder="Search with Ecosia"
           style="padding: 10px; width: 300px; font-size: 16px;
                  border-radius: 5px; border: none;"/>
    
    <button type="submit"
            style="padding: 10px 15px; font-size: 16px;
                   border-radius: 5px; margin-left: 10px;
                   background-color: #3B7A57; color: white;
                   border: none; cursor: pointer;">
        Search
    </button>
</form>

</html>
