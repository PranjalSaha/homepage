<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page Layout</title>



    <style>

        @font-face {
            font-family: '7-segment';
            src: url('./fonts/digital-7 (mono italic).ttf') format('truetype');
            font-weight: normal;
            font-size: normal;
        }

        body 
        {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: url('./photos/Swans.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        header 
        {
            width: 100%;
            padding: 20px;
            text-align: right;
        }

        form 
        {
            margin-bottom: 40px;
            text-align: center;
        }

        input[type="text"] 
        {
            padding: 10px;
            font-size: 16px;
            width: 300px;
            border-radius: 5px;
            border: none;
        }

        .quick-link 
        {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            margin: 0 5px;
            transition: background 0.3s ease;
        }

        .quick-link:hover 
            {background: rgba(255, 255, 255, 0.2);}

        button 
        {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            margin-left: 10px;
            background-color: #DE5833;
            color: white;
            border: none;
            cursor: pointer;
        }

        .clock {
          width: 300px;
          height: 300px;
          border: 10px solid #fff;
          border-radius: 50%;
          position: relative;
          background: radial-gradient(circle, 
                rgba(17, 17, 17, 0.1) 10%, rgba(51, 51, 51, 0.1) 90%);
        }

        .hand {
          position: absolute;
          width: 50%;
          height: 2px;
          background: white;
          top: 50%;
          left: 50%;
          transform-origin: 0% 50%;
          transform: rotate(90deg);
          transition: all 0.05s ease-in-out;
          will-change: transform;
          backface-visibility: hidden;
        }

        .hour {
          width: 30%;
          height: 8px;
          background: white;
          border-radius: 2px;
        }

        .minute {
          width: 45%;
          height: 5px;
          background: #ccc;
          border-radius: 1.5px;
        }

        .second {
          width: 48%;
          height: 3px;
          background: white;
          border-radius: 0.5px;
        }

        .center {
          width: 12px;
          height: 12px;
          background: white;
          border-radius: 50%;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          z-index: 10;
        }
    </style>

</head>

<body>

    <!-- Top: Link -->
    <header>

        <div>
            <a href="https://chat.openai.com/" 
                    target="_blank" class="quick-link">
                ChatGPT
            </a>

            <a href="https://bard.google.com/" 
                    target="_blank" class="quick-link">
                Bard
            </a>
        </div>


    </header>


      <div class="clock">
        <div class="hand hour" id="hour-hand"></div>
        <div class="hand minute" id="minute-hand"></div>
        <div class="hand second" id="second-hand"></div>
        <div class="center"></div>
      </div>


    <!-- Bottom: DuckDuckGo Search -->
    <form action="https://duckduckgo.com/" method="get">
        <input type="text" name="q" placeholder="Search with DuckDuckGo" />
            <button type="submit">&nbsp</button>
    </form>


    <script>
        function updateClock() 
        {
            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');

            now.toLocaleTimeString();

            document.getElementById('hours-minutes').textContent = 
                `${hours}:${minutes}`;
            document.getElementById('seconds').textContent =
                `${seconds}`
        }

        updateClock();
        setInterval(updateClock, 1000);

    </script>


     <script>
        function updateClock() {
          const now = new Date();

          const seconds = now.getSeconds();
          const minutes = now.getMinutes();
          const hours = now.getHours();

          const secondDeg = seconds * 6 - 90; // 360 / 60
          const minuteDeg = minutes * 6 + seconds * 0.1 - 90; // 360/60 + fine offset
          const hourDeg = (hours % 12) * 30 + minutes * 0.5 - 90; // 360/12 + fine offset

          document.getElementById("second-hand").style.transform =
            `rotate(${secondDeg}deg)`;
          document.getElementById("minute-hand").style.transform =
            `rotate(${minuteDeg}deg)`;
          document.getElementById("hour-hand").style.transform =
            `rotate(${hourDeg}deg)`;
        }

        setInterval(updateClock, 1000);
        updateClock();
      </script>

</body>

</html>
